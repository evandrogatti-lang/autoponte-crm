name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Core ESLint
        run: npx eslint app/api lib db tests --ignore-pattern dist --ignore-pattern .next

      - name: Unit tests
        run: npx --yes tsx@4.20.5 --test tests/*.test.ts

      - name: Diff check
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
